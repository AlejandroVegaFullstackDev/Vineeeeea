name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Instalar FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Compilar
        run: dotnet build Vineeeeea.slnx -c Release
      - name: Probar
        run: dotnet test Vineeeeea.slnx -c Release --no-build --filter "Category!=Whisper"
