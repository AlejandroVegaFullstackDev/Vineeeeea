<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vineeeeea — Exportar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&amp;family=Bricolage+Grotesque:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F3E6}
a{color:#111111}a:hover{color:#7A3E9D}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:2.5px solid #111111;border-radius:12px;background:#FFFFFF;color:#111111;font:700 15px 'Bricolage Grotesque',system-ui,sans-serif;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 #111111;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #111111}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111111}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border:2.5px solid #111111;border-radius:16px;background:#FFFFFF;color:#111111;text-align:left;font-family:'Bricolage Grotesque',system-ui,sans-serif;cursor:pointer;box-shadow:3px 3px 0 #111111;transition:transform .08s,box-shadow .08s}
.opt:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #111111}
.opt[aria-pressed="true"]{background:#D8E50F;box-shadow:6px 6px 0 #111111;transform:translate(-2px,-2px)}
input[type=text]{height:44px;padding:0 12px;border:2.5px solid #111111;border-radius:12px;background:#FFFFFF;color:#111111;font:600 15px 'Bricolage Grotesque',system-ui,sans-serif}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #7A3E9D;outline-offset:3px}
</style>
</helmet>

<div style="width: 100%; min-width: 0; min-height: 900px; box-sizing: border-box; padding: 40px 24px; background-color: #F6F3E6; background-image: radial-gradient(#E3DDC2 1.2px, transparent 1.3px); background-size: 18px 18px; color: #111111; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 15px">
  <div style="max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">

    <a href="Facil.dc.html" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-weight: 700; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Volver a editar
    </a>

    <div style="display: flex; align-items: center; gap: 20px">
      <div aria-hidden="true" style="width: 176px; flex: none; aspect-ratio: 16 / 9; border: 3px solid #111111; border-radius: 12px; box-shadow: 4px 4px 0 #111111; background: linear-gradient(90deg, #C9302C 0 16.6%, #2E9E3E 16.6% 33.3%, #D4C02A 33.3% 50%, #2A44C2 50% 66.6%, #B532B5 66.6% 83.3%, #2BB5BD 83.3%)"></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: 'Bowlby One', 'Arial Black', sans-serif; font-size: 36px; font-weight: 400; line-height: 1.05">¿Para dónde va tu video?</h1>
        <span style="color: #2A2A22; font-weight: 500">Demo Vineeeeea · 0:08 · horizontal</span>
      </div>
    </div>

    <div role="group" aria-label="Destino" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button class="opt" type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">
          <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 2.5px solid #111111; border-radius: 12px; background: {{o.chip}}">
            <span style="width: {{o.w}}px; height: {{o.h}}px; border: 2.5px solid #111111; border-radius: 3px; background: #FFFFFF"></span>
          </span>
          <span style="font-size: 17px; font-weight: 700">{{o.title}}</span>
          <span style="font-size: 13px; font-weight: 500; line-height: 1.35; color: #2A2A22">{{o.desc}}</span>
          <span style="font: 700 11px 'JetBrains Mono', ui-monospace, monospace">{{o.spec}}</span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{showNote}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 2.5px solid #111111; border-radius: 12px; background: #CDB3E3; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
        {{note}}
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; padding: 20px; border: 2.5px solid #111111; border-radius: 16px; background: #FFFFFF; box-shadow: 4px 4px 0 #111111">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="nombre" style="font-weight: 700">Nombre del archivo</label>
        <input id="nombre" type="text" value="Demo Vineeeeea">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="carpeta-label" style="font-weight: 700">Guardar en</span>
        <button class="btn" type="button" aria-labelledby="carpeta-label carpeta-valor" style="justify-content: space-between; box-shadow: none">
          <span id="carpeta-valor" style="font-weight: 600">[tu carpeta de Videos]</span>
          <span style="text-decoration: underline">Cambiar</span>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <span style="color: #2A2A22; font-weight: 500">Puedes seguir editando mientras se exporta.</span>
      <button class="btn" type="button" style="height: 60px; padding: 0 32px; background: #D8E50F; font-family: 'Bowlby One', 'Arial Black', sans-serif; font-size: 20px; font-weight: 400; box-shadow: 5px 5px 0 #111111">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
        ¡Exportar!
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'yt' };
  }
  renderVals() {
    const defs = [
      { id: 'yt', title: 'YouTube o computador', desc: 'Horizontal, se ve bien en pantalla grande.', spec: '1920×1080 · MP4', chip: '#F0955A', w: 26, h: 16, note: '' },
      { id: 'vert', title: 'TikTok, Reels o Shorts', desc: 'Vertical, para ver en el celular.', spec: '1080×1920 · MP4', chip: '#CDB3E3', w: 14, h: 24, note: 'Tu video es horizontal: quedará centrado con franjas arriba y abajo.' },
      { id: 'wa', title: 'WhatsApp', desc: 'Archivo liviano que se envía rápido.', spec: '1280×720 · MP4 liviano', chip: '#3DBA2E', w: 22, h: 14, note: '' },
      { id: 'max', title: 'Máxima calidad', desc: 'Para guardar o seguir editando en otro lado. Pesa más.', spec: '1920×1080 · calidad alta', chip: '#7A3E9D', w: 26, h: 16, note: '' }
    ];
    const current = defs.find((d) => d.id === this.state.pick) || defs[0];
    return {
      options: defs.map((d) => ({ ...d, pressed: d.id === current.id ? 'true' : 'false', pick: () => this.setState({ pick: d.id }) })),
      showNote: current.note !== '',
      note: current.note
    };
  }
}
</script>
</body>
</html>
